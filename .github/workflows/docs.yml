# Build the public documentation site (mkdocs.yml, docs/site/) and publish it
# to GitHub Pages.
#
# The set-support table is no longer measured here: the compliance oracle
# that measures it (oraclediff) lives in gorge-compliance
# (github.com/adams-shaun/gorge-compliance), so the set page shows its hand
# snapshot (docs/decisions/0001-repo-layout.md, amendment 3).
#
# The engine-speed chart reads history.jsonl from the orphan `perf-data`
# branch when that branch exists; perf data never lands on main.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - mkdocs.yml
      - scripts/docs_sets.py
      - cmd/pkgmap/**
      - .github/workflows/docs.yml
  # The perf-data branch changes many times a day; a daily rebuild picks it up.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/site/requirements.txt

      # Corpus-free and ~1 s: the per-tier package tables and the tier graph
      # (cmd/pkgmap, classification in docs/site/architecture/packages.tiers.json).
      - name: Generate the package map
        run: go run ./cmd/pkgmap > docs/site/architecture/_generated_packages.md

      - name: Fetch the perf history
        run: |
          if git fetch --depth=1 origin perf-data 2>/dev/null; then
            mkdir -p docs/site/perf
            git show FETCH_HEAD:history.jsonl > docs/site/perf/history.jsonl 2>/dev/null \
              || rm -f docs/site/perf/history.jsonl
          else
            echo "no perf-data branch yet; the tracking page shows 'no data yet'"
          fi

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
