# Build the public documentation site (mkdocs.yml, docs/site/) and publish it
# to GitHub Pages.
#
# Like the card-coverage job, the set-support measurement needs the Forge
# corpus, which is GPL-3.0 and never committed: the job fetches it at the
# FORGE_REF pin into the gitignored .cards/ and throws it away with the
# runner. Only counts and percentages reach the site, never card text, and
# nothing is written back to the repository.
#
# The engine-speed chart reads history.jsonl from the orphan `perf-data`
# branch when that branch exists; perf data never lands on main.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - mkdocs.yml
      - scripts/docs_sets.py
      - .github/workflows/docs.yml
  # Verdicts and the perf-data branch change many times a day; a daily
  # rebuild picks both up without a 7.5-minute oraclediff run per push.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/site/requirements.txt

      # ~25 MB sparse checkout of FORGE_REPO at the Makefile's FORGE_REF.
      - name: Fetch and compile the Forge corpus
        run: make fetch-cards compile-cards

      # ~7.5 min on 4 CPUs. `status -all` also checks compliance/ratchet.json
      # and exits non-zero when a set moves past it; that is not a docs
      # failure, so the exit is tolerated and the output used if non-empty.
      - name: Measure set support
        run: |
          go run ./cmd/oraclediff status -all -json -level A -procs 4 > status-A.jsonl || true
          if [ -s status-A.jsonl ]; then
            python3 scripts/docs_sets.py status-A.jsonl \
              --commit "$GITHUB_SHA" --date "$(date -u +%F)" || true
          else
            echo "::warning::oraclediff produced no output; the set page shows only the hand snapshot"
          fi

      - name: Fetch the perf history
        run: |
          if git fetch --depth=1 origin perf-data 2>/dev/null; then
            mkdir -p docs/site/perf
            git show FETCH_HEAD:history.jsonl > docs/site/perf/history.jsonl 2>/dev/null \
              || rm -f docs/site/perf/history.jsonl
          else
            echo "no perf-data branch yet; the tracking page shows 'no data yet'"
          fi

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
